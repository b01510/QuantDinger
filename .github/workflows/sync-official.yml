name: Sync Official QuantDinger

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-official.yml'

permissions:
  contents: write

jobs:
  sync-official:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror official upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --bare https://github.com/OpenByteInc/QuantDinger.git upstream.git
          cd upstream.git
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" refs/heads/main:refs/heads/official-original
